<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Redirector</title>
</head>
<body>
    <script>
        (function() {
            // Cấu hình mapping
            const BASE_URL = 'https://raw.githubusercontent.com/scriptmirroroffical/My-Script/refs/heads/Main/';
            const TARGET_HOST = 'My-Scripts.github.io';
            const TARGET_PATH = '/scripts/raw/';

            // Lấy URL hiện tại
            const currentUrl = window.location.href;
            const urlObj = new URL(currentUrl);

            // Kiểm tra host và path
            if (urlObj.hostname === TARGET_HOST && urlObj.pathname.startsWith(TARGET_PATH)) {
                // Lấy phần đường dẫn sau /scripts/raw/
                const relativePath = urlObj.pathname.substring(TARGET_PATH.length);
                // Loại bỏ tham số query và hash (nếu có)
                const cleanPath = relativePath.split('?')[0].split('#')[0];
                // Tạo URL mới
                const newUrl = BASE_URL + cleanPath;
                // Thực hiện redirect
                window.location.replace(newUrl);
            } else {
                // Nếu không khớp, hiển thị thông báo hoặc chuyển hướng về trang chủ
                document.body.innerHTML = '<h1>Invalid repository redirect</h1><p>Chỉ hỗ trợ redirect từ My-Scripts.github.io/scripts/raw/...</p>';
            }
        })();
    </script>
</body>
</html>
