<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repository Redirector</title>
    <script>
        (function() {
            // Cấu hình ánh xạ: đường dẫn gốc -> repository và nhánh tương ứng
            const REPO_MAP = {
                // Mặc định: nếu không khớp với bất kỳ ánh xạ nào, dùng giá trị này
                default: {
                    owner: 'scriptmirroroffical',
                    repo: 'My-Script',
                    branch: 'Main'
                },
                // Có thể thêm nhiều ánh xạ khác nếu cần
                // 'project-a': { owner: 'user', repo: 'RepoA', branch: 'master' },
                // 'project-b': { owner: 'user', repo: 'RepoB', branch: 'dev' }
            };

            // Lấy đường dẫn từ URL (phần sau hostname và optional prefix)
            var path = window.location.pathname; // ví dụ: /My-Script/script.lua
            // Loại bỏ dấu '/' đầu và cuối để xử lý
            var cleanPath = path.replace(/^\/+|\/+$/g, '');
            var parts = cleanPath.split('/');
            var repoKey = parts[0] || ''; // phần tử đầu tiên là tên repo hoặc key
            var relativeFile = parts.slice(1).join('/'); // phần còn lại là đường dẫn file

            // Nếu không có file chỉ định -> chuyển về root của repo
            if (!relativeFile) {
                // Chuyển đến trang chủ của repo trên GitHub
                var map = REPO_MAP[repoKey] || REPO_MAP['default'];
                window.location.href = 'https://github.com/' + map.owner + '/' + map.repo;
                return;
            }

            // Xác định ánh xạ dựa trên key (repoKey)
            var map = REPO_MAP[repoKey] || REPO_MAP['default'];

            // Tạo URL raw GitHub
            var rawUrl = 'https://raw.githubusercontent.com/' + 
                         map.owner + '/' + 
                         map.repo + '/refs/heads/' + 
                         map.branch + '/' + 
                         relativeFile;

            // Chuyển hướng
            window.location.href = rawUrl;
        })();
    </script>
</head>
<body>
    <!-- Không cần nội dung hiển thị, tự động chuyển hướng -->
</body>
</html>
